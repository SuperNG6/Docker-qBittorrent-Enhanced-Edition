name: Build Docker Image

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and push even if the Docker Hub version tag already exists
        type: boolean
        default: false
      force_release_sync:
        description: Sync upstream assets and notes even if the GitHub Release is complete
        type: boolean
        default: false
  schedule:
    - cron: "30 21 * * *"

permissions:
  contents: read

concurrency:
  group: publish-qbittorrentee
  cancel-in-progress: false

env:
  DOCKER_IMAGE: superng6/qbittorrentee
  UPSTREAM_REPO: c0re100/qBittorrent-Enhanced-Edition

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check latest upstream release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release=$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)
          if [[ ! "$release" =~ ^release-([0-9][0-9.]{0,127})$ ]]; then
            echo "::error::Unexpected upstream release tag: $release"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: check-version
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Check Docker Hub tag
        id: check
        shell: bash
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_BUILD" == "true" ]]; then
            should_build=true
            decision="Manual force_build requested"
          else
            tag_url="https://hub.docker.com/v2/repositories/$DOCKER_IMAGE/tags/$VERSION"
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$tag_url")
            case "$status" in
              200)
                should_build=false
                decision="Docker Hub already has $DOCKER_IMAGE:$VERSION"
                ;;
              404)
                should_build=true
                decision="Docker Hub does not have $DOCKER_IMAGE:$VERSION"
                ;;
              *)
                echo "::error::Docker Hub tag check failed with HTTP $status"
                exit 1
                ;;
            esac
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "$decision" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QBITTORRENT_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}
            ${{ env.DOCKER_IMAGE }}:latest

  sync-release:
    runs-on: ubuntu-latest
    needs: check-version
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Check GitHub Release
        id: check
        shell: bash
        env:
          FORCE_RELEASE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release_sync }}
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/upstream-release.json"
          downstream="$RUNNER_TEMP/downstream-release.json"
          gh release view "release-$VERSION" --repo "$UPSTREAM_REPO" --json assets,body,url > "$upstream"
          if ! jq -e '.assets | length > 0' "$upstream" >/dev/null; then
            echo "::error::Upstream release $VERSION has no downloadable assets"
            exit 1
          fi

          should_sync=true
          if [[ "$FORCE_RELEASE_SYNC" != "true" ]]; then
            status=$(curl --silent --show-error --max-time 30 --output "$downstream" \
              --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
            case "$status" in
              200)
                missing=$(jq -er --slurpfile upstream "$upstream" \
                  '([$upstream[0].assets[].name] - [.assets[].name]) | length' "$downstream")
                if [[ "$missing" == "0" ]]; then
                  should_sync=false
                fi
                ;;
              404) ;;
              *)
                echo "::error::GitHub Release check failed with HTTP $status"
                exit 1
                ;;
            esac
          fi
          echo "should_sync=$should_sync" >> "$GITHUB_OUTPUT"
          echo "GitHub Release $VERSION needs sync: $should_sync" >> "$GITHUB_STEP_SUMMARY"

      - name: Download upstream assets and notes
        if: steps.check.outputs.should_sync == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/qbittorrent"
          gh release download "release-$VERSION" --repo "$UPSTREAM_REPO" --dir "$RUNNER_TEMP/qbittorrent"
          jq -r '"Upstream release: " + .url + "\n\n" + (.body // "")' \
            "$RUNNER_TEMP/upstream-release.json" > "$RUNNER_TEMP/ReleaseNotes.md"

      - name: Sync GitHub Release
        if: steps.check.outputs.should_sync == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: qBittorrent Enhanced Edition v${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body_path: ${{ runner.temp }}/ReleaseNotes.md
          files: ${{ runner.temp }}/qbittorrent/*
          fail_on_unmatched_files: true
