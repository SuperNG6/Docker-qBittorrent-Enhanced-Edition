name: Build qBittorrent Enhanced Edition s6 v3 Image

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: Build and push even if the Docker Hub version tag already exists
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-qbittorrentee-s6v3
  cancel-in-progress: false

env:
  DOCKER_IMAGE: superng6/qbittorrentee
  TAG_SUFFIX: -s6v3
  PLATFORMS: linux/amd64,linux/arm64
  UPSTREAM_REPO: c0re100/qBittorrent-Enhanced-Edition

jobs:
  check-version:
    if: github.ref == 'refs/heads/s6v3'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check latest upstream release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release=$(gh release view --repo "$UPSTREAM_REPO" --json tagName --jq .tagName)
          if [[ ! "$release" =~ ^release-([0-9][0-9.]{0,127})$ ]]; then
            echo "::error::Unexpected upstream release tag: $release"
            exit 1
          fi
          version=${BASH_REMATCH[1]}
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upstream version: $version" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-latest
    needs: check-version
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Check Docker Hub tag
        id: check
        shell: bash
        env:
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build }}
        run: |
          set -euo pipefail

          if [[ "$FORCE_BUILD" == "true" ]]; then
            should_build=true
            decision="Manual force_build requested"
          else
          tag_url="https://hub.docker.com/v2/repositories/$DOCKER_IMAGE/tags/${VERSION}${TAG_SUFFIX}"
            status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$tag_url")
            case "$status" in
              200)
                should_build=false
              decision="Docker Hub already has $DOCKER_IMAGE:${VERSION}${TAG_SUFFIX}"
                ;;
              404)
                should_build=true
              decision="Docker Hub does not have $DOCKER_IMAGE:${VERSION}${TAG_SUFFIX}"
                ;;
              *)
                echo "::error::Docker Hub tag check failed with HTTP $status"
                exit 1
                ;;
            esac
          fi
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "$decision" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out source
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Test WebUI and s6 on all release platforms
        if: steps.check.outputs.should_build == 'true'
        run: |
          IFS=, read -ra platforms <<< "$PLATFORMS"
          for platform in "${platforms[@]}"; do
            docker buildx build --load --platform "$platform" \
              --build-arg "QBITTORRENT_VERSION=$VERSION" --tag local/qbittorrentee:s6v3-test .
            bash tests/smoke-s6v3.sh local/qbittorrentee:s6v3-test "$platform" qBittorrent
          done

      - name: Login to Docker Hub
        if: steps.check.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        if: steps.check.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            QBITTORRENT_VERSION=${{ env.VERSION }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.VERSION }}${{ env.TAG_SUFFIX }}
            ${{ env.DOCKER_IMAGE }}:latest${{ env.TAG_SUFFIX }}
